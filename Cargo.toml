[package]
name = "mark"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A single-purpose Markdown viewer: mark <file> opens a window and renders it."
license = "MIT"
repository = "https://github.com/marcos-venicius/mark"
authors = ["Marcos Venicius"]

[[bin]]
name = "mark"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# The mermaid bundle is 3.5 MB as it ships and 976 KB in gzip. Embedding it raw
# would more than double the binary, so it is stored compressed and inflated
# once, the first time a document turns out to have a diagram in it.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
mime_guess = "2"
notify = "8"
open = "5"
percent-encoding = "2"
serde_json = "1"
syntect = "5.3"
tao = "0.37"
two-face = "0.5"
wry = "0.56"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Nothing new is being pulled in: windows-sys is already compiled for Windows,
# by notify -> walkdir -> winapi-util. The features are declarations and nothing
# else -- Win32_Security is in the list because CreateFileW takes a pointer to a
# SECURITY_ATTRIBUTES that this program only ever passes as null.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
]

# The icon has to reach the .exe as a Win32 resource and cargo will not put it
# there. Build-time only, Windows only: nothing is linked into the program and
# nothing new compiles on Linux. See build.rs for why the cfg is on the host.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies.comrak]
version = "0.54"
default-features = false
features = ["syntect-onig"]


[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"
