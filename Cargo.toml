[package]
name = "mark"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A single-purpose Markdown viewer: mark <file> opens a window and renders it."
license = "MIT"

[[bin]]
name = "mark"
path = "src/main.rs"

[dependencies]
anyhow = "1"
mime_guess = "2"
notify = "8"
open = "5"
percent-encoding = "2"
serde_json = "1"
syntect = "5.3"
tao = "0.37"
two-face = "0.5"
wry = "0.56"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Nothing new is being pulled in: windows-sys is already compiled for Windows,
# by notify -> walkdir -> winapi-util. The features are declarations and nothing
# else -- Win32_Security is in the list because CreateFileW takes a pointer to a
# SECURITY_ATTRIBUTES that this program only ever passes as null.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
]

[dependencies.comrak]
version = "0.54"
default-features = false
features = ["syntect-onig"]


[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"
