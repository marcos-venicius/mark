<!doctype html>
<html lang="en" data-copy-pictures="{{COPY_PICTURES}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Documents may contain raw HTML, so the page is locked down to what a reader
     legitimately needs: local assets over our own protocol, and remote images.
     No outbound requests of any other kind. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src mark: http://mark.localhost;
  style-src mark: http://mark.localhost 'unsafe-inline';
  font-src mark: http://mark.localhost data:;
  img-src mark: http://mark.localhost data: https:;
  media-src mark: http://mark.localhost data:;
  connect-src 'none';
  form-action 'none';
  base-uri 'none';
">
<title>mark</title>
<link rel="stylesheet" href="{{STYLE_URL}}">
<style>/*{{SYNTAX_CSS}}*/</style>
</head>
<body>
  <!-- Everything here has a key as well, and the key is in the tooltip: the bar
       is how a reader who never opens a terminal finds out that the keys exist
       at all. Nothing in it reaches Rust by a route of its own -- each button
       sends the message its shortcut already sends.

       The icons are drawn here rather than written as characters. The two fonts
       compiled into the binary are Inter and JetBrains Mono, and neither has a
       reload or a printer glyph; a document should not look different because
       the machine happens to have a font that does. -->
  <header id="bar">
    <div class="bar-group">
      <button id="bar-open" type="button" title="Open a file (Ctrl O)" aria-label="Open a file">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>
      <button id="bar-back" type="button" title="Back (Alt Left)" aria-label="Back" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      </button>
      <button id="bar-forward" type="button" title="Forward (Alt Right)" aria-label="Forward" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
      <button id="bar-reload" type="button" title="Reload from disk (Ctrl R)" aria-label="Reload">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3.5V9h-5.5"/></svg>
      </button>
      <!-- A folder like the open button's, with an arrow leaving it: this one
           goes out to the file manager rather than bringing a file in. -->
      <button id="bar-folder" type="button" title="Show in folder (Ctrl Shift O)" aria-label="Show the file in its folder">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12V9a2 2 0 0 0-2-2h-8L9 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h7"/><path d="m16 20 5-5"/><path d="M17 15h4v4"/></svg>
      </button>
      <!-- A page with a slash on it, for the path. It answers a copy the way the
           source's copy button does, with a check in place of the icon. -->
      <button id="bar-path" class="copier" type="button" title="Copy the full path (Ctrl Shift P)" aria-label="Copy the file's full path">
        <svg class="icon-copy" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="m13.5 11-3 7"/></svg>
        <svg class="icon-done" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
      </button>

      <span class="bar-sep"></span>

      <button id="bar-toc" type="button" title="Table of contents (T)" aria-label="Table of contents" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h10"/></svg>
      </button>
      <button id="bar-find" type="button" title="Find in page (/)" aria-label="Find in page" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      </button>
      <button id="bar-wide" type="button" title="Full window width (Z)" aria-label="Use the full window width" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16"/><path d="M16 12h6"/><path d="m19 9 3 3-3 3"/><path d="M8 12H2"/><path d="m5 9-3 3 3 3"/></svg>
      </button>
      <button id="bar-source" type="button" title="Markdown source (Ctrl U)" aria-label="Show the Markdown source" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 7-5 5 5 5"/><path d="m16 7 5 5-5 5"/><path d="m14 4-4 16"/></svg>
      </button>
    </div>

    <span id="bar-name"></span>

    <div class="bar-group bar-right">
      <!-- Two icons, and the stylesheet shows one: the check is the button
           saying the copy worked, which a button with no words in it has no
           other way to say. -->
      <button id="bar-copy" class="copier" type="button" title="Copy the Markdown source (Ctrl Shift C)" aria-label="Copy the Markdown source">
        <svg class="icon-copy" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
        <svg class="icon-done" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
      </button>
      <button id="bar-print" type="button" title="Print, or save as PDF (Ctrl P)" aria-label="Print">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3h10v6"/><path d="M7 18H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v7H7z"/></svg>
      </button>
      <!-- A half-filled circle, and only the one: the button used to carry a moon
           and a sun so it could show what pressing it would give, and it opens a
           menu now, which gives nothing on its own. Which palette is in use is
           what the ticked entry says. -->
      <button id="bar-theme" type="button" title="Theme (D)" aria-label="Theme" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="help-open" type="button" title="Help (?)" aria-label="Help">?</button>
    </div>
  </header>

  <!-- The bar is a row and the rest of the window is what is left below it, so
       the sidebar and the document need a row of their own to sit in. -->
  <div id="split">
    <aside id="toc" hidden>
      <p class="toc-heading">Contents</p>
      <nav id="toc-list"></nav>
    </aside>

    <div id="page">
      <main id="content"></main>

      <!-- The file as it was written, one row per line, filled in by app.js
           while Ctrl U has it on screen. The line numbers are drawn by the
           stylesheet, so no selection can pick them up. -->
      <div id="source" aria-label="Markdown source" hidden></div>

      <!-- The window with nothing in it: where mark starts when it was given no
           file, and where Esc lands once there is nothing left to dismiss.

           The second button is the way back from an Esc nobody meant to press.
           Its label is filled in from Rust, because the page is never told which
           file it is showing -- only Rust knows what was just closed. -->
      <div id="empty" hidden>
        <svg id="empty-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
        <p id="empty-message">No file open</p>
        <p id="empty-hint">Choose one below, or drag a Markdown file into the window</p>
        <div id="empty-actions">
          <button id="empty-open" type="button">Choose a file</button>
          <button id="empty-reopen" type="button" hidden></button>
        </div>
        <!-- Which mark this is, on the one screen that belongs to mark rather
             than to a document: the one a launch from the menu opens on. -->
        <p id="empty-version">mark {{VERSION}}</p>
      </div>
    </div>
  </div>

  <!-- The palettes, written here rather than built in app.js because the markup
       never changes: only which entry is ticked does. Every value but "system"
       is a :root[data-theme=...] block in style.css and a scope render.rs gives
       syntax colours to, and the_theme_menu_offers_every_palette_the_stylesheet_declares
       is what keeps the lists together. -->
  <div id="theme-menu" role="menu" aria-labelledby="bar-theme" hidden>
    <button type="button" role="menuitemradio" value="system" aria-checked="true">System</button>
    <button type="button" role="menuitemradio" value="light" aria-checked="false">Light</button>
    <button type="button" role="menuitemradio" value="dark" aria-checked="false">Dark</button>
    <button type="button" role="menuitemradio" value="catppuccin-mocha" aria-checked="false">Catppuccin Mocha</button>
    <button type="button" role="menuitemradio" value="gruvbox-dark" aria-checked="false">Gruvbox Dark</button>
    <button type="button" role="menuitemradio" value="blacksite" aria-checked="false">Blacksite</button>
    <button type="button" role="menuitemradio" value="sereno-light" aria-checked="false">Sereno Light</button>
    <button type="button" role="menuitemradio" value="sereno-dark" aria-checked="false">Sereno Dark</button>
  </div>

  <div id="find" hidden>
    <input id="find-input" type="search" placeholder="Find in page" spellcheck="false" autocomplete="off">
    <button id="find-prev" type="button" title="Previous (Shift+Enter)" aria-label="Previous match">&#8593;</button>
    <button id="find-next" type="button" title="Next (Enter)" aria-label="Next match">&#8595;</button>
    <button id="find-close" type="button" title="Close (Esc)" aria-label="Close">&#10005;</button>
  </div>

  <!-- A diagram opened over the window, to be moved about, zoomed and copied as a
       picture. app.js moves the figure itself in here and back out again; the
       canvas is only somewhere to hang it. Every button is also a key, and the
       key is in its tooltip, the way the bar does it. -->
  <div id="viewer" hidden>
    <div id="viewer-stage" tabindex="-1">
      <div id="viewer-canvas"></div>
    </div>
    <div id="viewer-bar">
      <button id="viewer-out" type="button" title="Zoom out (-)" aria-label="Zoom out">&#8722;</button>
      <button id="viewer-fit" type="button" title="Fit to the window (0)" aria-label="Fit to the window">100%</button>
      <button id="viewer-in" type="button" title="Zoom in (+)" aria-label="Zoom in">+</button>
      <button id="viewer-copy" type="button" title="Copy as a PNG picture (Ctrl C)">Copy PNG</button>
      <button id="viewer-close" type="button" title="Close (Esc)" aria-label="Close">&#10005;</button>
    </div>
  </div>

  <!-- The panel is built in Rust, from the table --help prints from, and dropped
       in here at startup. Not a <dialog>: its own Escape handling would fight the
       one in app.js, and hidden + CSS is how the find bar already works. -->
  <div id="help" hidden>
    <div id="help-card" role="dialog" aria-modal="true" aria-labelledby="help-title" tabindex="-1">
      <button id="help-close" type="button" title="Close (Esc)" aria-label="Close">&#10005;</button>
      {{HELP}}
    </div>
  </div>

  <script src="{{APP_URL}}"></script>
</body>
</html>
