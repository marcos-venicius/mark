<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Documents may contain raw HTML, so the page is locked down to what a reader
     legitimately needs: local assets over our own protocol, and remote images.
     No outbound requests of any other kind. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src mark: http://mark.localhost;
  style-src mark: http://mark.localhost 'unsafe-inline';
  font-src mark: http://mark.localhost data:;
  img-src mark: http://mark.localhost data: https:;
  media-src mark: http://mark.localhost data:;
  connect-src 'none';
  form-action 'none';
  base-uri 'none';
">
<title>mark</title>
<link rel="stylesheet" href="{{STYLE_URL}}">
<style>/*{{SYNTAX_CSS}}*/</style>
</head>
<body>
  <aside id="toc" hidden>
    <p class="toc-heading">Contents</p>
    <nav id="toc-list"></nav>
  </aside>

  <div id="page">
    <main id="content"></main>
  </div>

  <div id="find" hidden>
    <input id="find-input" type="search" placeholder="Find in page" spellcheck="false" autocomplete="off">
    <button id="find-prev" type="button" title="Previous (Shift+Enter)" aria-label="Previous match">&#8593;</button>
    <button id="find-next" type="button" title="Next (Enter)" aria-label="Next match">&#8595;</button>
    <button id="find-close" type="button" title="Close (Esc)" aria-label="Close">&#10005;</button>
  </div>

  <!-- The panel is built in Rust, from the table --help prints from, and dropped
       in here at startup. Not a <dialog>: its own Escape handling would fight the
       one in app.js, and hidden + CSS is how the find bar already works. -->
  <div id="help" hidden>
    <div id="help-card" role="dialog" aria-modal="true" aria-labelledby="help-title" tabindex="-1">
      <button id="help-close" type="button" title="Close (Esc)" aria-label="Close">&#10005;</button>
      {{HELP}}
    </div>
  </div>

  <!-- The only visible affordance in the window. Without it, a reader who never
       runs mark from a terminal has no way of learning that the keys exist. -->
  <button id="help-open" type="button" title="Help (?)" aria-label="Help">?</button>

  <script src="{{APP_URL}}"></script>
</body>
</html>
